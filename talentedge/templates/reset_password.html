<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Reset Password - TalentEdge</title><link rel="stylesheet" href="/static/css/main.css"></head><body>
<div class="auth-container">
<div class="auth-brand"><div style="font-size:3rem;margin-bottom:1rem">🔒</div><h1>New Password</h1><p>Choose a strong password to secure your account.</p></div>
<div class="auth-form-panel"><div class="auth-form-box"><h2>Set New Password</h2><p class="subtitle">Must be at least 8 characters.</p>
<form id="resetForm" onsubmit="event.preventDefault(); submitForm('resetForm','/api/auth/reset-password','/login','Password reset! Please sign in.')">
<input type="hidden" name="token" value="{{ token }}">
<div class="form-group"><label>New Password</label><div class="input-wrapper"><input type="password" name="new_password" required placeholder="Min 8 chars" oninput="checkStrength(this.value)"><button type="button" class="toggle-pw" onclick="togglePassword(this)">👁</button></div><div class="strength-bar"><div id="str-bar"></div></div><div class="strength-text" id="str-text"></div></div>
<div class="form-group"><label>Confirm Password</label><div class="input-wrapper"><input type="password" name="confirm_password" required placeholder="Re-enter"><button type="button" class="toggle-pw" onclick="togglePassword(this)">👁</button></div></div>
<button type="submit" class="btn btn-primary"><div class="spinner"></div><span class="btn-text">Reset Password</span></button>
</form>
<div class="form-links"><a href="/login">← Back to Sign In</a></div>
</div></div></div>
<script src="/static/js/app.js"></script></body></html>
