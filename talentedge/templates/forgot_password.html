<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Forgot Password - TalentEdge</title><link rel="stylesheet" href="/static/css/main.css"></head><body>
<div class="auth-container">
<div class="auth-brand"><div style="font-size:3rem;margin-bottom:1rem">🔑</div><h1>Reset Password</h1><p>Enter your email and we'll send you a link to reset your password.</p></div>
<div class="auth-form-panel"><div class="auth-form-box"><h2>Forgot Password?</h2><p class="subtitle">No worries, we'll send you reset instructions.</p>
<form id="forgotForm" onsubmit="event.preventDefault(); submitForm('forgotForm','/api/auth/forgot-password',null,'Check your email for reset instructions.')">
<div class="form-group"><label>Email Address</label><input type="email" name="email" required placeholder="you@company.com"></div>
<button type="submit" class="btn btn-primary"><div class="spinner"></div><span class="btn-text">Send Reset Link</span></button>
</form>
<div class="form-links"><a href="/login">← Back to Sign In</a></div>
</div></div></div>
<script src="/static/js/app.js"></script></body></html>
