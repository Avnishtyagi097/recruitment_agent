<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sign Up - TalentEdge</title><link rel="stylesheet" href="/static/css/main.css"></head><body>
<div class="auth-container">
<div class="auth-brand"><div style="font-size:3rem;margin-bottom:1rem">🚀</div><h1>Join TalentEdge</h1><p>Create your account and start screening candidates with AI. Free to get started.</p><div class="features"><div>✅ No credit card required</div><div>✅ Set up in 60 seconds</div><div>✅ Secure & compliant</div></div></div>
<div class="auth-form-panel"><div class="auth-form-box"><h2>Create Account</h2><p class="subtitle">Fill in your details to get started</p>
<form id="signupForm" onsubmit="event.preventDefault(); submitForm('signupForm','/api/auth/signup','/login','Account created! Please sign in.')">
<div class="form-group"><label>Full Name</label><input type="text" name="full_name" required placeholder="John Doe"></div>
<div class="form-group"><label>Email Address</label><input type="email" name="email" required placeholder="you@company.com"></div>
<div class="form-group"><label>Company / Firm Name</label><input type="text" name="company_name" required placeholder="Acme Recruiting"></div>
<div class="form-group"><label>Phone <span style="color:#94A3B8">(optional)</span></label><input type="tel" name="phone_number" placeholder="+91 98765 43210"></div>
<div class="form-group"><label>Password</label><div class="input-wrapper"><input type="password" name="password" required placeholder="Min 8 chars" oninput="checkStrength(this.value)"><button type="button" class="toggle-pw" onclick="togglePassword(this)">👁</button></div><div class="strength-bar"><div id="str-bar"></div></div><div class="strength-text" id="str-text"></div></div>
<div class="form-group"><label>Confirm Password</label><div class="input-wrapper"><input type="password" name="confirm_password" required placeholder="Re-enter password"><button type="button" class="toggle-pw" onclick="togglePassword(this)">👁</button></div></div>
<button type="submit" class="btn btn-primary"><div class="spinner"></div><span class="btn-text">Create Account</span></button>
</form>
<div class="form-links">Already have an account? <a href="/login">Sign In</a></div>
</div></div></div>
<script src="/static/js/app.js"></script></body></html>
